name: Publish MCP Registry listing

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified MCP publisher
        run: |
          curl -fsSLo /tmp/mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz
          echo '1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340  /tmp/mcp-publisher.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
      - name: Publish with GitHub OIDC
        run: |
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish server.json
